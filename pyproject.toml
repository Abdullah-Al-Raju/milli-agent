[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "milli-agent"
version = "0.1.0"
description = "Autonomous OS-level agent powered by the Continuous 4D Spatiotemporal Manifold Engine. Continuous 60Hz perception, sub-10ms non-autoregressive decisions, universal model adapters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Milli Dual License (Free for Personal/Academic; Commercial License Required)" }
authors = [
    { name = "Abdullah Al Raju", email = "analystx.raju@gmail.com" }
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pillow>=9.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
milli-agent = "milli_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["milli_agent*"]
